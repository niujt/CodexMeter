name: macOS public update configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-config:
    if: >-
      github.repository == 'niujt/CodexMeter' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare pinned official Sparkle tools before receiving any Secret
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/Sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          printf '%s  %s\n' c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c "$RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          test -x "$RUNNER_TEMP/sparkle/bin/sign_update"
          xcrun swiftc script/sparkle_public_key.swift -o "$RUNNER_TEMP/sparkle-public-key"
      - name: Verify the export and signing path using a synthetic seed
        run: |
          export SPARKLE_PRIVATE_KEY="$(python3 -c 'import base64; print(base64.b64encode(bytes([1])*32).decode())')"
          python3 script/export_macos_update_config.py \
            --public-key-tool "$RUNNER_TEMP/sparkle-public-key" \
            --sign-tool "$RUNNER_TEMP/sparkle/bin/sign_update" \
            --output "$RUNNER_TEMP/synthetic-public-config"
      - name: Reuse the configured signing Secret and export public files only
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 script/export_macos_update_config.py \
            --public-key-tool "$RUNNER_TEMP/sparkle-public-key" \
            --sign-tool "$RUNNER_TEMP/sparkle/bin/sign_update" \
            --output "$RUNNER_TEMP/macos-update-public"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-update-public
          path: ${{ runner.temp }}/macos-update-public/*
          if-no-files-found: error
          retention-days: 7
